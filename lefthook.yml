pre-commit:
  piped: true
  commands:
    playground-types:
      priority: 1
      glob: "packages/dms/{playground/frontend-vue,frontend-vue}/**/*.{ts,vue}"
      run: test -e packages/dms/playground/.frontend-vue-types/tsconfig.json || pnpm --dir packages/dms/playground run -s types:prepare
    antelopejs-format:
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    antelopejs-lint:
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,vue}"
      run: pnpm exec oxlint --no-error-on-unmatched-pattern {staged_files}
    antelopejs-size:
      run: pnpm exec antelopejs-check-size --staged {staged_files}
    antelopejs-suppressions:
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,vue}"
      run: pnpm exec antelopejs-suppressions --staged
pre-push:
  commands:
    antelopejs-typecheck:
      run: pnpm run typecheck
