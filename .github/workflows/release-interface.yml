name: Release DMS interface

on:
  workflow_dispatch:
    inputs:
      channel:
        description: npm distribution channel
        required: true
        default: latest
        type: choice
        options: [latest, next]

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    name: Validate interface release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release source and package metadata
        env:
          CHANNEL: ${{ inputs.channel }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$CHANNEL" in
            latest) release_branch=$DEFAULT_BRANCH ;;
            next) release_branch=next ;;
            *) exit 1 ;;
          esac
          test "$GITHUB_REF" = "refs/heads/$release_branch"
          node <<'NODE'
          const pkg = require('./packages/interface-dms/package.json')
          if (
            pkg.name !== '@antelopejs/interface-dms' ||
            pkg.private === true ||
            pkg.license !== 'Apache-2.0' ||
            pkg.repository.url !== 'git+https://github.com/AntelopeJS/dms.git' ||
            pkg.publishConfig.registry !== 'https://registry.npmjs.org/' ||
            pkg.publishConfig.access !== 'public' ||
            pkg.publishConfig.provenance !== true ||
            pkg.antelopeJs === undefined
          ) process.exit(1)
          NODE
  release:
    needs: validate
    uses: AntelopeJS/.github/.github/workflows/release-npm-public.yml@v1
    with:
      channel: ${{ inputs.channel }}
      package-directory: packages/interface-dms
    secrets:
      RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
