name: Release DMS module

on:
  workflow_dispatch:
    inputs:
      channel:
        description: npm distribution channel
        required: true
        default: latest
        type: choice
        options: [latest, next]
      release-version:
        description: Exact stable version; empty uses the automatic increment
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    name: Validate module release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate release source and package metadata
        env:
          CHANNEL: ${{ inputs.channel }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$CHANNEL" in
            latest) release_branch=$DEFAULT_BRANCH ;;
            next) release_branch=next ;;
            *) exit 1 ;;
          esac
          test "$GITHUB_REF" = "refs/heads/$release_branch"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { satisfiesBoundedRange, satisfiesImplementedRange } from './checks/release-range.mjs'
          const readJson = (path) => JSON.parse(readFileSync(path, 'utf8'))
          const pkg = readJson('./packages/dms/package.json')
          const iface = readJson('./packages/interface-dms/package.json')
          const builder = readJson('./packages/interface-dms-builder/package.json')
          if (
            pkg.name !== '@antelopejs/dms' ||
            pkg.private === true ||
            pkg.license !== 'Apache-2.0' ||
            pkg.repository.url !== 'git+https://github.com/AntelopeJS/dms.git' ||
            pkg.publishConfig.registry !== 'https://registry.npmjs.org/' ||
            pkg.publishConfig.access !== 'public' ||
            pkg.publishConfig.provenance !== true ||
            !satisfiesImplementedRange(iface.version, pkg.dependencies['@antelopejs/interface-dms']) ||
            !satisfiesBoundedRange(builder.version, pkg.dependencies['@antelopejs/interface-dms-builder']) ||
            // The runtime provides the interface package and nothing else.
            !pkg.antelopeJs.implements.includes('@antelopejs/interface-dms') ||
            pkg.antelopeJs.implements.some((name) => name !== '@antelopejs/interface-dms')
          ) process.exit(1)
          NODE
      # A module released while an interface it depends on has unreleased source
      # points at a published interface that lacks what the module calls. Release
      # the interface first.
      - name: Refuse unreleased interface source
        run: |
          node --input-type=module <<'NODE'
          import { unreleasedInterfaces } from './checks/unreleased-interfaces.mjs'
          const unreleased = unreleasedInterfaces('.')
          for (const { name, reason } of unreleased) console.error(`${name}: ${reason}`)
          if (unreleased.length > 0) process.exit(1)
          NODE
      # The module is built and tested against the in-tree interfaces, so a
      # module released before one of them is published installs broken. The
      # interfaces are released by their own workflow; this one only refuses to
      # run before they have landed.
      - name: Verify the interface releases it will point at
        run: |
          for dir in packages/interface-dms packages/interface-dms-builder; do
            spec=$(node -p "const p = require('./$dir/package.json'); p.name + '@' + p.version")
            npm view "$spec" version --registry=https://registry.npmjs.org/
          done
  release:
    needs: validate
    uses: AntelopeJS/.github/.github/workflows/release-npm-public.yml@492c1f55e32fa1b7bd2c5a65a1714498930d9e20
    with:
      channel: ${{ inputs.channel }}
      release-version: ${{ inputs.release-version }}
      package-directory: packages/dms
    secrets:
      RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
