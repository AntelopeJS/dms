name: Release DMS module

on:
  workflow_dispatch:
    inputs:
      channel:
        description: npm distribution channel
        required: true
        default: latest
        type: choice
        options: [latest, next]
      release-version:
        description: Exact stable version; empty uses the automatic increment
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    name: Validate module release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate release source and package metadata
        env:
          CHANNEL: ${{ inputs.channel }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$CHANNEL" in
            latest) release_branch=$DEFAULT_BRANCH ;;
            next) release_branch=next ;;
            *) exit 1 ;;
          esac
          test "$GITHUB_REF" = "refs/heads/$release_branch"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { satisfiesImplementedRange } from './checks/release-range.mjs'
          const readJson = (path) => JSON.parse(readFileSync(path, 'utf8'))
          const pkg = readJson('./packages/dms/package.json')
          // The interface packages of this repository the runtime may provide, by manifest.
          const implementable = new Map([
            ['@antelopejs/interface-dms', './packages/interface-dms/package.json'],
            ['@antelopejs/interface-dms-builder', './packages/interface-dms-builder/package.json'],
          ])
          const implementsInTree = (name) =>
            implementable.has(name) &&
            satisfiesImplementedRange(readJson(implementable.get(name)).version, pkg.dependencies[name])
          if (
            pkg.name !== '@antelopejs/dms' ||
            pkg.private === true ||
            pkg.license !== 'Apache-2.0' ||
            pkg.repository.url !== 'git+https://github.com/AntelopeJS/dms.git' ||
            pkg.publishConfig.registry !== 'https://registry.npmjs.org/' ||
            pkg.publishConfig.access !== 'public' ||
            pkg.publishConfig.provenance !== true ||
            // The runtime provides interface-dms, and otherwise only interface packages of this
            // repository, each at a range its version in the tree satisfies.
            !pkg.antelopeJs.implements.includes('@antelopejs/interface-dms') ||
            !pkg.antelopeJs.implements.every(implementsInTree)
          ) process.exit(1)
          NODE
      # The module depends on each interface it implements through
      # `>=<floor> <0.<minor+1>.0`, so a module released against an unpublished
      # interface installs broken. The interfaces are released by their own
      # workflow; this one only refuses to run before they have landed.
      - name: Verify the interface releases it will point at
        run: |
          for name in $(node -p "require('./packages/dms/package.json').antelopeJs.implements.join(' ')"); do
            version=$(node -p "require('./packages/${name#@antelopejs/}/package.json').version")
            npm view "$name@$version" version --registry=https://registry.npmjs.org/
          done
  release:
    needs: validate
    uses: AntelopeJS/.github/.github/workflows/release-npm-public.yml@492c1f55e32fa1b7bd2c5a65a1714498930d9e20
    with:
      channel: ${{ inputs.channel }}
      release-version: ${{ inputs.release-version }}
      package-directory: packages/dms
    secrets:
      RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
