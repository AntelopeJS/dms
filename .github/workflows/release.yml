name: Release DMS module

on:
  workflow_dispatch:
    inputs:
      channel:
        description: npm distribution channel
        required: true
        default: latest
        type: choice
        options: [latest, next]

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    name: Validate module release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release source and package metadata
        env:
          CHANNEL: ${{ inputs.channel }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          case "$CHANNEL" in latest|next) ;; *) exit 1 ;; esac
          node <<'NODE'
          const pkg = require('./packages/dms/package.json')
          const iface = require('./packages/interface-dms/package.json')
          // The interface sitting in the tree only has to SATISFY the range the
          // module publishes: a floor that lags it widens what consumers may
          // install, it does not create a second copy. The fleet shape is
          // `>=<floor> <1.0.0`, so the ceiling is out of reach for a 0.x
          // interface and comparing the release triples is enough.
          const compare = (a, b) => {
            const parts = (v) => v.split('-')[0].split('.').map(Number)
            const [x, y] = [parts(a), parts(b)]
            return x[0] - y[0] || x[1] - y[1] || x[2] - y[2]
          }
          const satisfiesFleetRange = (version, range) => {
            const floor = /^>=(\d+\.\d+\.\d+) <1\.0\.0$/.exec(range ?? '')?.[1]
            return floor !== undefined && compare(version, floor) >= 0
          }
          if (
            pkg.name !== '@antelopejs/dms' ||
            pkg.private === true ||
            pkg.license !== 'Apache-2.0' ||
            pkg.repository.url !== 'git+https://github.com/AntelopeJS/dms.git' ||
            pkg.publishConfig.registry !== 'https://registry.npmjs.org/' ||
            pkg.publishConfig.access !== 'public' ||
            pkg.publishConfig.provenance !== true ||
            !satisfiesFleetRange(iface.version, pkg.dependencies['@antelopejs/interface-dms']) ||
            // The runtime provides the interface package and nothing else.
            !pkg.antelopeJs.implements.includes('@antelopejs/interface-dms') ||
            pkg.antelopeJs.implements.some((name) => name !== '@antelopejs/interface-dms')
          ) process.exit(1)
          NODE
      # The module depends on the interface through `>=<interface version> <1.0.0`,
      # so a module released against an unpublished interface installs broken. The
      # interface is released by its own workflow; this one only refuses to run
      # before it has landed.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify the interface release it will point at
        run: |
          version=$(node -p "require('./packages/interface-dms/package.json').version")
          npm view "@antelopejs/interface-dms@$version" version \
            --registry=https://registry.npmjs.org/
  release:
    needs: validate
    uses: AntelopeJS/.github/.github/workflows/release-npm-public.yml@1df63ee37c5ecb869124cb58f199cef1e19dd138
    with:
      channel: ${{ inputs.channel }}
      package-directory: packages/dms
    secrets:
      RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
