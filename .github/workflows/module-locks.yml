name: module locks

on:
  schedule:
    - cron: "47 4 * * *"
  pull_request:
    paths:
      - .github/workflows/module-locks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    permissions:
      contents: read
    uses: AntelopeJS/.github/.github/workflows/module-locks-refresh.yml@59fb12497e1bc9e5f2bac4f68fe25907f46c28e8
    with:
      projects: |
        packages/dms/playground
      commands: |
        rm -rf packages/dms/antelope-lock
        pnpm --dir packages/dms build
        cd packages/dms
        DMS_PREBUILT=1 pnpm exec ajs module test . -f dist/test/unit/api-base-url.test.js < /dev/null
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
