name: ci

on:
  push:
    branches:
      - main
  # No branch filter: the lint wave stacks pull requests on top of each other,
  # and filtering on `main` left every intermediate step ungated -- only the
  # secret scanner ran.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The checks run as parallel jobs: one sequential job waited for the sum of
# them, the slowest alone is enough. Every job builds what it reads exactly
# once, then sets DMS_PREBUILT so the package scripts and the test harness use
# that build rather than compiling it again.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DMS_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v4
      # `dms lint` runs the Vue layer's ESLint too.
      - uses: ./.github/actions/setup
        with:
          interface: "true"

      - uses: AntelopeJS/tooling-configs/actions/docs@310e3d861b2da2244902854379176c91e1ebc68e
        with:
          files: |
            README.md
            packages/dms/README.md
            packages/dms/docs
            packages/interface-dms/README.md
            packages/interface-dms/docs
          typescript-project: packages/interface-dms/docs/tsconfig.json

      - run: pnpm --dir packages/interface-dms lint
      - run: pnpm --dir packages/interface-dms typecheck
      - run: pnpm --dir packages/interface-dms knip
      # Node does not fall back to a directory index inside an exports map, so
      # a new interface folder is unreachable until the map lists it.
      - run: pnpm --dir packages/interface-dms check:exports
      # ImplementInterface binds only the proxies a subpath exports, and an
      # unbound one never answers.
      - run: pnpm --dir packages/interface-dms check:proxies

      - run: pnpm --dir packages/dms lint
      # oxlint's type-aware pass degrades to `any` on a broken tsconfig
      # without failing, so the typecheck is what catches it.
      - run: pnpm --dir packages/dms typecheck
      # Unused dependencies only. `pnpm knip:all` also reports dead files and
      # exports, which the interface architecture makes noisy enough to need a
      # human, so they stay out of the gate.
      - run: pnpm --dir packages/dms knip
      # The docs site builds its block reference from the committed catalog,
      # so a block option changed without regenerating it fails here.
      - run: pnpm --dir packages/dms docs:catalog:check

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    env:
      DMS_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # The MongoDB binary the harness downloads and the provider modules it
      # installs into its cache folder are both pinned in antelope.test.ts.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mongodb-binaries
            packages/dms/.antelope/cache
          key: dms-test-harness-${{ runner.os }}-${{ hashFiles('packages/dms/src/test/antelope.test.ts') }}

      # Also the compile gate: the separate `build` step this job replaces
      # had nothing else to check.
      - run: pnpm --dir packages/dms build
      # Needs no service: the harness starts an in-memory MongoDB replica set
      # and lets the OS pick the api port.
      - run: pnpm --dir packages/dms test:${{ matrix.suite }}

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      # Some tests import the interface's chart helpers at runtime.
      - uses: ./.github/actions/setup
        with:
          interface: "true"

      # Most of the suite's time is the per-file jsdom setup, which splits
      # evenly across shards.
      - run: pnpm --dir packages/dms/frontend-vue test --shard=${{ matrix.shard }}/2

  frontend-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          interface: "true"

      # `ajs dms verify-source`: the client, SSR and e-mail builds, the bundle
      # check and vue-tsc, in a workspace of its own.
      - run: pnpm --dir packages/dms/frontend-vue typecheck

  # GitOps deploys on a successful `ci` push run on main, so this gate has to
  # run there. Its six-minute Docker build kept every pull request waiting, so
  # pull requests skip it.
  docs-playground:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # This also renders every documentation example in both themes. A broken
      # preview must fail before the successful main CI event reaches GitOps.
      - run: docker build -f Dockerfile.playground -t dms-playground:ci .
      - name: Start the shipped artifacts against a fresh database
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker logs docs-backend || true
            docker logs docs-frontend || true
            docker rm -f docs-frontend docs-backend docs-mongo || true
          }
          trap cleanup EXIT
          docker run -d --name docs-mongo mongo:8.0.8 --bind_ip 127.0.0.1
          docker run -d --name docs-backend --network container:docs-mongo \
            -e MONGO_URL=mongodb://127.0.0.1:27017 dms-playground:ci \
            node packages/dms/scripts/docs-playground.mjs backend
          docker run -d --name docs-frontend --network container:docs-mongo dms-playground:ci
          for attempt in $(seq 1 90); do
            if docker exec docs-frontend node -e '
              const preview = await fetch("http://127.0.0.1:3001/dms-preview");
              const source = await fetch("http://127.0.0.1:5010/dms/frontend");
              if (preview.status !== 200 || source.status !== 401) process.exit(1);
            '; then
              exit 0
            fi
            sleep 2
          done
          echo "The built playground did not become ready" >&2
          exit 1

  # The one check branch protection requires was the single job's name, so it
  # stays: green only when every job above is. docs-playground may be skipped
  # on a pull request only.
  ubuntu:
    if: always()
    needs: [static, backend, frontend-test, frontend-verify, docs-playground]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          needs.static.result == 'skipped' ||
          needs.backend.result == 'skipped' ||
          needs.frontend-test.result == 'skipped' ||
          needs.frontend-verify.result == 'skipped' ||
          (github.event_name != 'pull_request' && needs.docs-playground.result == 'skipped')
        run: exit 1
