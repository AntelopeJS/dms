name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [next]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The checks run as parallel jobs: one sequential job waited for the sum of
# them, the slowest alone is enough. Every job builds what it reads exactly
# once, then sets DMS_PREBUILT so the package scripts and the test harness use
# that build rather than compiling it again.
jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    with:
      docs-files: |
        README.md
        docs
        packages/dms/README.md
        packages/dms/docs
        packages/interface-dms/README.md
        packages/interface-dms/docs
        packages/interface-dms-builder/README.md
        packages/interface-dms-builder/docs
      docs-typescript-project: packages/interface-dms/docs/tsconfig.json
      extra-commands: |
        pnpm --dir packages/interface-dms check:exports
        pnpm --dir packages/interface-dms check:proxies
        pnpm --dir packages/dms docs:catalog:check
        pnpm --dir packages/dms mockup:schema:check
        pnpm --dir packages/dms check:frontend-declarations
      renovate-sync: false
      test-job: true
    permissions:
      contents: read

  # ci-node.yml exposes no outputs, so this takes its tier rule from the shared
  # action and forces the tier of an event it does not know. checks/
  # affected-packages.mjs is the only selector: it plans the packages, the
  # formal checks and the jobs of the run, and every job below reads that plan.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      os: ${{ steps.tier.outputs.os }}
      packages: ${{ steps.plan.outputs.packages }}
      formal: ${{ steps.plan.outputs.formal }}
      formal-generated: ${{ steps.plan.outputs.formal-generated }}
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Pick the tier with the shared rule
        id: pick
        uses: AntelopeJS/.github/.github/actions/ci-tier@v2
      - name: Force the tier of a merge queue run
        id: tier
        env:
          EVENT: ${{ github.event_name }}
          TIER: ${{ steps.pick.outputs.tier }}
        run: |
          set -euo pipefail
          tier="$TIER"
          if [[ "$EVENT" == merge_group ]]; then
            tier=queue
          fi

          test_base=""
          if [[ "$EVENT" == pull_request ]]; then
            test_base=$(git rev-parse --verify HEAD^1)
          fi

          os='["ubuntu-latest"]'
          if [[ "$tier" == nightly ]]; then
            os='["ubuntu-latest","windows-latest"]'
          fi

          {
            echo "tier=${tier}"
            echo "test-base=${test_base}"
            echo "os=${os}"
          } >> "$GITHUB_OUTPUT"
      - name: Plan the packages, the formal checks and the jobs
        id: plan
        env:
          ANTELOPEJS_CI_TIER: ${{ steps.tier.outputs.tier }}
          ANTELOPEJS_TEST_BASE: ${{ steps.tier.outputs.test-base }}
        run: |
          set -euo pipefail
          plan=$(node checks/affected-packages.mjs)
          echo "$plan" >> "$GITHUB_OUTPUT"
          {
            echo "Tier \`${ANTELOPEJS_CI_TIER}\`"
            echo '```'
            echo "$plan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'backend')
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 35 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select.outputs.os) }}
        suite:
          - unit
          - integration
          - builder:1/4
          - builder:2/4
          - builder:3/4
          - builder:4/4
    defaults:
      run:
        shell: bash
    env:
      DMS_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # The MongoDB binary the harness downloads and the provider modules it
      # installs into its cache folder are pinned in antelope.test.ts, and the
      # modules install from the locks in antelope-lock/.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mongodb-binaries
            packages/dms/.antelope/cache
          key: dms-test-harness-${{ runner.os }}-${{ hashFiles('packages/dms/src/test/antelope.test.ts', 'packages/dms/antelope-lock/**') }}

      # Also the compile gate: the separate `build` step this job replaces
      # had nothing else to check.
      - run: pnpm --dir packages/dms build
      # Needs no service: the harness starts an in-memory MongoDB replica set
      # and lets the OS pick the api port. A builder shard takes its files by
      # the seconds in scripts/test-weights.json and records this run's.
      - env:
          SUITE: ${{ matrix.suite }}
          DMS_TEST_DURATIONS: ${{ runner.temp }}/builder-durations.json
        run: |
          if [[ "$SUITE" == builder:* ]]; then
            export DMS_TEST_SHARD="${SUITE#builder:}"
            SUITE=builder:shard
          fi
          pnpm --dir packages/dms "test:${SUITE}"
      - if: ${{ !cancelled() && runner.os == 'Linux' && startsWith(matrix.suite, 'builder:') }}
        uses: actions/upload-artifact@v4
        with:
          name: builder-durations-${{ strategy.job-index }}
          path: ${{ runner.temp }}/builder-durations.json
          retention-days: 14

  frontend-test:
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'frontend-test')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select.outputs.os) }}
        shard: [1, 2]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Some tests import the interface's chart helpers at runtime.
      - uses: ./.github/actions/setup
        with:
          interface: "true"

      # Most of the suite's time is the per-file jsdom setup, which splits
      # evenly across shards.
      - run: pnpm --dir packages/dms/frontend-vue test --shard=${{ matrix.shard }}/2

  frontend-verify:
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'frontend-verify')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select.outputs.os) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          interface: "true"

      # `ajs dms verify-source`: the client, SSR and e-mail builds, the bundle
      # check and vue-tsc, in a workspace of its own.
      - run: pnpm --dir packages/dms/frontend-vue typecheck

  dependents:
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'dependents')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: dms-saas
            module: packages/dms-saas/frontend-vue
          - repository: dms-automation
            module: packages/dms-automation/frontend-vue
          - repository: dms-marketing
            module: packages/dms-marketing/frontend-vue
          - repository: dms-lang
            module: frontend-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AntelopeJS/${{ matrix.repository }}
          ref: next
          path: dependents/${{ matrix.repository }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          interface: "true"
      - run: pnpm --dir packages/dms/frontend-vue typecheck -m "$GITHUB_WORKSPACE/dependents/${{ matrix.repository }}/${{ matrix.module }}"

  # The shipped playground image is checked in the merge queue and on the
  # nightly run. Its Docker build kept every pull request waiting, so pull
  # requests skip it. Only the stable prefix of the image (apt, corepack and
  # the pnpm store, the `deps` stage) goes to the layer cache, so the layers of
  # each checkout never fill the repository's cache.
  docs-playground:
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'docs-playground')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.playground
          target: deps
          cache-from: type=gha,scope=docs-playground
          cache-to: type=gha,mode=max,scope=docs-playground
      # This also renders every documentation example in both themes, so a
      # broken preview fails here.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.playground
          load: true
          tags: dms-playground:ci
          cache-from: type=gha,scope=docs-playground
      - name: Start the shipped artifacts against a fresh database
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker logs docs-backend || true
            docker logs docs-frontend || true
            docker rm -f docs-frontend docs-backend docs-mongo || true
          }
          trap cleanup EXIT
          docker run -d --name docs-mongo mongo:8.0.8 --bind_ip 127.0.0.1
          docker run -d --name docs-backend --network container:docs-mongo \
            -e MONGO_URL=mongodb://127.0.0.1:27017 dms-playground:ci \
            node packages/dms/scripts/docs-playground.mjs backend
          docker run -d --name docs-frontend --network container:docs-mongo dms-playground:ci
          for attempt in $(seq 1 90); do
            if docker exec docs-frontend node -e '
              const preview = await fetch("http://127.0.0.1:3001/dms-preview");
              const source = await fetch("http://127.0.0.1:5010/dms/frontend");
              if (preview.status !== 200 || source.status !== 401) process.exit(1);
            '; then
              exit 0
            fi
            sleep 2
          done
          echo "The built playground did not become ready" >&2
          exit 1

  verify-map:
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'verify-map')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select.outputs.os) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node packages/dms/bin/dms-control.mjs map

  # The journeys of e2e/ as a Playwright suite: the @smoke ones on the fast and
  # full tiers, every journey in 4 shards on the queue tier and in 2 on the
  # nightly tier, nothing on a draft. Its global setup prepares and starts one
  # dms-control run.
  e2e:
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.tier == 'nightly' && '[1, 2]' || needs.select.outputs.tier == 'queue' && '[1, 2, 3, 4]' || '[1]') }}
    env:
      TIER: ${{ needs.select.outputs.tier }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The base-version journey builds origin/main in a worktree.
      - run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          echo "DMS_CONTROL_RUNS=${RUNNER_TEMP}/dms-runs" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mongodb-binaries
            ~/.cache/ms-playwright
            packages/dms/playground/.antelope/cache
          key: e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/dms/playground/antelope.config.ts') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/dms-control/frontend
          key: dms-control-frontend-${{ github.sha }}
          restore-keys: dms-control-frontend-
      - name: Install Chromium and its system packages
        run: |
          if timeout 240 pnpm exec playwright install --with-deps --only-shell chromium; then
            exit 0
          fi
          echo "::warning::Chromium's system packages did not install: installing the browser alone"
          pnpm exec playwright install --only-shell chromium
      - if: env.TIER == 'fast' || env.TIER == 'full'
        run: pnpm e2e --grep @smoke
      - if: env.TIER == 'queue'
        run: pnpm e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - if: env.TIER == 'nightly'
        run: pnpm e2e --shard=${{ matrix.shard }}/2 --reporter=blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: e2e/blob-report
      # The declarations @antelopejs/dms/e2e publishes, built by the run's prepare.
      - if: success() || failure()
        run: pnpm exec tsc --noEmit -p e2e
      - if: always() && env.TIER == 'nightly'
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
            ${{ runner.temp }}/dms-runs/*/evidence
            ${{ runner.temp }}/dms-runs/*/logs
          retention-days: 7

  # One HTML and JSON report of the nightly shards.
  e2e-report:
    needs: [select, e2e]
    if: always() && needs.select.outputs.tier == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: e2e/blob-reports
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html,json e2e/blob-reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e/playwright-report
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e/playwright-report/results.json
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  # The checks the selector plans: those the change touches on a pull request,
  # all of them in the queue and on the nightly run.
  formal:
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'formal')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.select.outputs.formal) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/antelopejs-formal
          key: tla2tools-1.7.4
      - run: node .agents/skills/${{ matrix.check }}/check.mjs
      - run: |
          history=".agents/skills/${CHECK}/history.mjs"
          if [[ -f "$history" ]]; then node "$history"; fi
        env:
          CHECK: ${{ matrix.check }}

  # The formal checks that call the real code with generated inputs: they build
  # the module and boot the test harness, which the TLA+ checks above do not.
  formal-generated:
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'formal-generated')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.select.outputs.formal-generated) }}
    env:
      DMS_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mongodb-binaries
            packages/dms/.antelope/cache
          key: dms-test-harness-${{ runner.os }}-${{ hashFiles('packages/dms/src/test/antelope.test.ts', 'packages/dms/antelope-lock/**') }}
      - run: pnpm --dir packages/dms build
      - run: node .agents/skills/${{ matrix.check }}/check.mjs

  # The one check branch protection requires was the single job's name, so it
  # stays: green only when every job the plan requires is. A job outside the
  # plan is skipped and does not fail it, a required job that was skipped does,
  # and so does a failed or cancelled one. A draft pull request fails it, so
  # merge-when-green cannot merge on the draft run.
  ubuntu:
    if: always()
    needs:
      - select
      - ci
      - backend
      - frontend-test
      - frontend-verify
      - docs-playground
      - verify-map
      - formal
      - e2e
      - formal-generated
      - dependents
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail on a job that failed, was cancelled or was required and did not succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          REQUIRED: ${{ needs.select.outputs.jobs }}
        run: |
          set -euo pipefail
          offenders=$(jq -r --argjson required "${REQUIRED:-[]}" '
            . as $needs
            | [ ("select", "ci") as $job | select($needs[$job].result != "success") | $job ]
              + [ $needs | to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key ]
              + [ $required[] | select(($needs[.].result // "missing") != "success") ]
            | unique[]
            | "\(.): \($needs[.].result // "missing")"
          ' <<< "$NEEDS")
          if [[ -n "$offenders" ]]; then
            echo "::error::Jobs that did not pass: $(tr '\n' ' ' <<< "$offenders")"
            echo "$offenders"
            exit 1
          fi
      - if: needs.select.outputs.tier == 'draft'
        run: |
          echo "::error::Draft pull request: only lint and typecheck ran. Mark it ready for review to run the tests."
          exit 1
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
      statuses: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
