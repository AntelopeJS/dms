name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: Run the nightly tier, with the Windows jobs and Stress
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The checks run as parallel jobs: one sequential job waited for the sum of
# them, the slowest alone is enough. Every job builds what it reads exactly
# once, then sets DMS_PREBUILT so the package scripts and the test harness use
# that build rather than compiling it again.
jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    with:
      docs-files: |
        README.md
        docs
        packages/dms/README.md
        packages/dms/docs
        packages/interface-dms/README.md
        packages/interface-dms/docs
        packages/interface-dms-builder/README.md
        packages/interface-dms-builder/docs
      docs-typescript-project: packages/interface-dms/docs/tsconfig.json
      extra-commands: |
        pnpm --dir packages/interface-dms check:exports
        pnpm --dir packages/interface-dms check:proxies
        pnpm --dir packages/dms docs:catalog:check
        pnpm --dir packages/dms mockup:schema:check
        pnpm --dir packages/dms check:frontend-declarations
      module-locks: true
      renovate-sync: false
      test-job: true
      single-job: false
      nightly: ${{ inputs.nightly == true }}
    permissions:
      contents: read

  # ci-node.yml exposes no outputs, so this takes its tier rule from the shared
  # action and forces the tier of an event it does not know. checks/
  # affected-packages.mjs is the only selector: it plans the packages, the
  # formal checks and the jobs of the run, and every job below reads that plan.
  select:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      exclude-os: ${{ steps.tier.outputs.exclude-os }}
      packages: ${{ steps.plan.outputs.packages }}
      formal: ${{ steps.plan.outputs.formal }}
      formal-generated: ${{ steps.plan.outputs.formal-generated }}
      jobs: ${{ steps.plan.outputs.jobs }}
      backend-suites: ${{ steps.plan.outputs.backend-suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Pick the tier with the shared rule
        id: pick
        uses: AntelopeJS/.github/.github/actions/ci-tier@v2
      - name: Force the tier of a merge queue run
        id: tier
        env:
          EVENT: ${{ github.event_name }}
          TIER: ${{ steps.pick.outputs.tier }}
        run: |
          set -euo pipefail
          tier="$TIER"
          if [[ "$EVENT" == merge_group ]]; then
            tier=queue
          fi

          test_base=""
          if [[ "$EVENT" == pull_request ]]; then
            test_base=$(git rev-parse --verify HEAD^1)
          fi

          exclude_os='[{"os":"blacksmith-4vcpu-windows-2025"}]'
          if [[ "$tier" == nightly ]]; then
            exclude_os='[]'
          fi

          {
            echo "tier=${tier}"
            echo "test-base=${test_base}"
            echo "exclude-os=${exclude_os}"
          } >> "$GITHUB_OUTPUT"
      - name: Plan the packages, the formal checks and the jobs
        id: plan
        env:
          ANTELOPEJS_CI_TIER: ${{ steps.tier.outputs.tier }}
          ANTELOPEJS_TEST_BASE: ${{ steps.tier.outputs.test-base }}
        run: |
          set -euo pipefail
          plan=$(node checks/affected-packages.mjs)
          echo "$plan" >> "$GITHUB_OUTPUT"
          {
            echo "Tier \`${ANTELOPEJS_CI_TIER}\`"
            echo '```'
            echo "$plan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'backend')
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'blacksmith-4vcpu-windows-2025' && 35 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404, blacksmith-4vcpu-windows-2025]
        exclude: ${{ fromJSON(needs.select.outputs.exclude-os) }}
        suite: ${{ fromJSON(needs.select.outputs.backend-suites) }}
    defaults:
      run:
        shell: bash
    env:
      DMS_PREBUILT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # The MongoDB binary the harness downloads and the provider modules it
      # installs into its cache folder are pinned in antelope.test.ts, and the
      # modules install from the locks in antelope-lock/.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/mongodb-binaries
            packages/dms/.antelope/cache
          key: dms-test-harness-${{ runner.os }}-${{ hashFiles('packages/dms/src/test/antelope.test.ts', 'packages/dms/antelope-lock/**') }}

      # Also the compile gate: the separate `build` step this job replaces
      # had nothing else to check.
      - run: pnpm --dir packages/dms build
      # Needs no service: the harness starts an in-memory MongoDB replica set
      # and lets the OS pick the api port. A builder shard takes its files by
      # the seconds in scripts/test-weights.json and records this run's.
      - env:
          SUITE: ${{ matrix.suite }}
          DMS_TEST_DURATIONS: ${{ runner.temp }}/builder-durations.json
        run: |
          if [[ "$SUITE" == builder:* ]]; then
            export DMS_TEST_SHARD="${SUITE#builder:}"
            SUITE=builder:shard
          fi
          pnpm --dir packages/dms "test:${SUITE}"
      - if: ${{ !cancelled() }}
        uses: AntelopeJS/.github/.github/actions/module-locks-committed@v2
      - if: ${{ !cancelled() && runner.os == 'Linux' && startsWith(matrix.suite, 'builder:') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: builder-durations-${{ strategy.job-index }}
          path: ${{ runner.temp }}/builder-durations.json
          retention-days: 14

  frontend-test:
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'frontend-test')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404, blacksmith-4vcpu-windows-2025]
        exclude: ${{ fromJSON(needs.select.outputs.exclude-os) }}
        shard: [1, 2]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Some tests import the interface's chart helpers at runtime.
      - uses: ./.github/actions/setup
        with:
          interface: "true"

      # Most of the suite's time is the per-file jsdom setup, which splits
      # evenly across shards.
      - run: pnpm --dir packages/dms/frontend-vue test --shard=${{ matrix.shard }}/2

  frontend-verify:
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'frontend-verify')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404, blacksmith-4vcpu-windows-2025]
        exclude: ${{ fromJSON(needs.select.outputs.exclude-os) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          interface: "true"

      # `ajs dms verify-source`: the client, SSR and e-mail builds, the bundle
      # check and vue-tsc, in a workspace of its own.
      - run: pnpm --dir packages/dms/frontend-vue typecheck

  dependents:
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'dependents')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: dms-saas
            module: packages/dms-saas/frontend-vue
          - repository: dms-automation
            module: packages/dms-automation/frontend-vue
          - repository: dms-marketing
            module: packages/dms-marketing/frontend-vue
          - repository: dms-lang
            module: frontend-vue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AntelopeJS/${{ matrix.repository }}
          path: dependents/${{ matrix.repository }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          interface: "true"
      - run: pnpm --dir packages/dms/frontend-vue typecheck -m "$GITHUB_WORKSPACE/dependents/${{ matrix.repository }}/${{ matrix.module }}"

  # The shipped playground image is checked in the merge queue and on the
  # nightly run. Its Docker build kept every pull request waiting, so pull
  # requests skip it. Only the stable prefix of the image (apt, corepack and
  # the pnpm store, the `deps` stage) goes to the layer cache, so the layers of
  # each checkout never fill the repository's cache. The nightly run on main
  # writes it: a merge group's ref reads main's cache but not another group's.
  docs-playground:
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'docs-playground')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.playground
          target: deps
          cache-from: type=gha,scope=docs-playground
          cache-to: ${{ github.event_name == 'schedule' && 'type=gha,mode=max,scope=docs-playground' || '' }}
      # This also renders every documentation example in both themes, so a
      # broken preview fails here.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.playground
          load: true
          tags: dms-playground:ci
          cache-from: type=gha,scope=docs-playground
      - name: Start the shipped artifacts against a fresh database
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker logs docs-backend || true
            docker logs docs-frontend || true
            docker rm -f docs-frontend docs-backend docs-mongo || true
          }
          trap cleanup EXIT
          docker run -d --name docs-mongo mongo:8.0.8 --bind_ip 127.0.0.1
          docker run -d --name docs-backend --network container:docs-mongo \
            -e MONGO_URL=mongodb://127.0.0.1:27017 dms-playground:ci \
            node packages/dms/scripts/docs-playground.mjs backend
          docker run -d --name docs-frontend --network container:docs-mongo dms-playground:ci
          for attempt in $(seq 1 90); do
            if docker exec docs-frontend node -e '
              const preview = await fetch("http://127.0.0.1:3001/dms-preview");
              const source = await fetch("http://127.0.0.1:5010/dms/frontend");
              if (preview.status !== 200 || source.status !== 401) process.exit(1);
            '; then
              exit 0
            fi
            sleep 2
          done
          echo "The built playground did not become ready" >&2
          exit 1

  # The Playwright suite of e2e/, when the plan selects it: its global setup
  # prepares the playground and starts one run of the @antelopejs/dms/e2e kit
  # for each of its two workers.
  # A pull request runs the @smoke tests. The merge queue runs the whole suite
  # in nine shards; a manual run, a pull request labelled ci:full and the
  # nightly schedule in three. e2e-report merges the shards into one report.
  # The shard list carries the choice: ["smoke"], or the shard numbers.
  e2e:
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'e2e')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.tier == 'queue' && '[1, 2, 3, 4, 5, 6, 7, 8, 9]' || (needs.select.outputs.tier == 'nightly' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && '[1, 2, 3]' || '["smoke"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The base-version journey builds origin/main in a worktree.
      - run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          echo "DMS_E2E_RUNS=${RUNNER_TEMP}/dms-runs" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/mongodb-binaries
            ~/.cache/ms-playwright
            packages/dms/playground/.antelope/cache
          key: e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/dms/playground/antelope.config.ts', 'packages/dms/playground/antelope-lock/**') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/dms-e2e/frontend
          key: dms-e2e-frontend-${{ github.sha }}
          restore-keys: dms-e2e-frontend-
      - run: pnpm exec playwright install --only-shell chromium
      - name: Install the playground's modules in the checkout, where a lock they write is seen
        run: pnpm exec ajs project build -e docs -p packages/dms/playground
        env:
          DMS_PREBUILT: "1"
      - uses: AntelopeJS/.github/.github/actions/module-locks-committed@v2
      - if: matrix.shard == 'smoke'
        run: pnpm e2e --grep @smoke
      - if: matrix.shard != 'smoke'
        run: pnpm e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }} --add-reporter=blob
        env:
          DMS_E2E_DURATIONS: ${{ runner.temp }}/e2e-durations.json
          PLAYWRIGHT_BLOB_OUTPUT_DIR: e2e/blob-report
      # The kit's phase timings of the shard, as a notice on the check run.
      - if: success() || failure()
        run: node e2e/timings-summary.mjs "$DMS_E2E_RUNS"
      # The run helper of @antelopejs/dms/e2e/run, on the playground the suite prepared.
      - if: matrix.shard == 'smoke' || matrix.shard == 1
        run: node --test packages/dms/e2e/run.test.mjs
      # The journeys that open no tab, through runJourney of @antelopejs/dms/e2e/run.
      - if: (success() || failure()) && matrix.shard == 1
        run: node --test e2e/integration/journeys.test.mjs
      # The declarations @antelopejs/dms/e2e publishes, built by the run's prepare.
      - if: success() || failure()
        run: pnpm exec tsc --noEmit -p e2e
      - if: ${{ !cancelled() && matrix.shard != 'smoke' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-durations-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-durations.json
          retention-days: 14
      - if: always() && matrix.shard != 'smoke'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
            ${{ runner.temp }}/dms-runs/*/evidence
            ${{ runner.temp }}/dms-runs/*/logs
          retention-days: 7

  # One HTML and JSON report of the shards, whenever the whole suite ran.
  e2e-report:
    needs: [select, e2e]
    if: always() && needs.e2e.result != 'skipped' && (needs.select.outputs.tier == 'queue' || needs.select.outputs.tier == 'nightly' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full'))
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: e2e/blob-reports
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html,json e2e/blob-reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e/playwright-report
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e/playwright-report/results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  # The checks the selector plans: those the change touches on a pull request,
  # all of them in the queue and on the nightly run, which checks their full
  # configurations, as a manual run does.
  formal:
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'formal')
    uses: ./.github/workflows/formal.yml
    with:
      checks: ${{ needs.select.outputs.formal }}
      full: ${{ needs.select.outputs.tier == 'nightly' || github.event_name == 'workflow_dispatch' }}

  formal-generated:
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'formal-generated')
    uses: ./.github/workflows/formal-generated.yml
    with:
      checks: ${{ needs.select.outputs.formal-generated }}

  # The org ruleset requires this job, named `ubuntu`, next to the `ci / checks`
  # of the shared workflow, so the name stays. It is green only when every job
  # the plan requires is, and a failed or cancelled job fails it. On the fast
  # and none tiers the planner narrows the run, so a job outside the plan may
  # be skipped. On every other tier the gate holds its own table of the jobs
  # the tier must run, apart from the planner, so a planner that drops a job
  # fails the gate (`checks/ci-gate.mjs`).
  ubuntu:
    if: always()
    needs:
      - select
      - ci
      - backend
      - frontend-test
      - frontend-verify
      - docs-playground
      - formal
      - e2e
      - formal-generated
      - dependents
      - e2e-report
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: checks
          persist-credentials: false
      - name: Fail on a job that failed, was cancelled or did not succeed where the tier requires it
        env:
          NEEDS: ${{ toJSON(needs) }}
          REQUIRED: ${{ needs.select.outputs.jobs }}
          TIER: ${{ needs.select.outputs.tier }}
          EVENT: ${{ github.event_name }}
        run: node checks/ci-gate.mjs
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
      statuses: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
  module-locks:
    needs: [ci, backend, e2e, formal-generated]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: read
    uses: AntelopeJS/.github/.github/workflows/module-locks-renovate.yml@v2
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
  verdict:
    needs:
      - ci
      - select
      - backend
      - frontend-test
      - frontend-verify
      - dependents
      - docs-playground
      - e2e
      - e2e-report
      - formal
      - formal-generated
      - ubuntu
      - renovate-sync
      - module-locks
    if: ${{ !cancelled() }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "$failed"
            exit 1
          fi
