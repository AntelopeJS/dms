name: docs-playground

# The shipped playground image is checked in the merge queue and on the
# nightly run. Its Docker build kept every pull request waiting, so pull
# requests skip it. Only the stable prefix of the image (apt, corepack and
# the pnpm store, the `deps` stage) goes to the layer cache, so the layers of
# each checkout never fill the repository's cache. The nightly run on main
# writes it: a merge group's ref reads main's cache but not another group's.
on:
  workflow_call:

jobs:
  docs-playground:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.playground
          target: deps
          cache-from: type=gha,scope=docs-playground
          cache-to: ${{ github.event_name == 'schedule' && 'type=gha,mode=max,scope=docs-playground' || '' }}
      # This also renders every documentation example in both themes, so a
      # broken preview fails here.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.playground
          load: true
          tags: dms-playground:ci
          cache-from: type=gha,scope=docs-playground
      - name: Start the shipped artifacts against a fresh database
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker logs docs-backend || true
            docker logs docs-frontend || true
            docker rm -f docs-frontend docs-backend docs-mongo || true
          }
          trap cleanup EXIT
          docker run -d --name docs-mongo mongo:8.0.8 --bind_ip 127.0.0.1
          docker run -d --name docs-backend --network container:docs-mongo \
            -e MONGO_URL=mongodb://127.0.0.1:27017 dms-playground:ci \
            node packages/dms/scripts/docs-playground.mjs backend
          docker run -d --name docs-frontend --network container:docs-mongo dms-playground:ci
          for attempt in $(seq 1 90); do
            if docker exec docs-frontend node -e '
              const preview = await fetch("http://127.0.0.1:3001/dms-preview");
              const source = await fetch("http://127.0.0.1:5010/dms/frontend");
              if (preview.status !== 200 || source.status !== 401) process.exit(1);
            '; then
              exit 0
            fi
            sleep 2
          done
          echo "The built playground did not become ready" >&2
          exit 1
