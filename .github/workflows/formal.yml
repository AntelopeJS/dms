name: formal

# The TLA+ and property checks ci.yml's selector plans, each with its history
# check. `full` runs their full configurations (--full).
on:
  workflow_call:
    inputs:
      checks:
        description: The check names, as a JSON array
        required: true
        type: string
      full:
        description: Run each check's full configuration
        required: true
        type: boolean

jobs:
  formal:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: ${{ inputs.full && 60 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(inputs.checks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/antelopejs-formal
          key: tla2tools-1.7.4
      - run: node .agents/skills/${{ matrix.check }}/check.mjs ${{ inputs.full && '--full' || '' }}
      - run: |
          history=".agents/skills/${CHECK}/history.mjs"
          if [[ -f "$history" ]]; then node "$history"; fi
        env:
          CHECK: ${{ matrix.check }}
