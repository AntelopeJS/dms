name: formal

# The TLA+ and property checks ci.yml's selector plans, each with its history
# check. `full` runs their full configurations (--full).
on:
  workflow_call:
    inputs:
      checks:
        description: The check names, as a JSON array
        required: true
        type: string
      full:
        description: Run each check's full configuration
        required: true
        type: boolean

jobs:
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full && 60 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(inputs.checks) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/antelopejs-formal
          key: tla2tools-1.7.4
      - run: node .agents/skills/${{ matrix.check }}/check.mjs ${{ inputs.full && '--full' || '' }}
      - run: |
          history=".agents/skills/${CHECK}/history.mjs"
          if [[ -f "$history" ]]; then node "$history"; fi
        env:
          CHECK: ${{ matrix.check }}
