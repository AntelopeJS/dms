name: formal-generated

# The formal checks that call the real code with generated inputs: they build
# the module and boot the test harness, which the TLA+ checks do not.
on:
  workflow_call:
    inputs:
      checks:
        description: The check names, as a JSON array
        required: true
        type: string

jobs:
  formal-generated:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(inputs.checks) }}
    env:
      DMS_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mongodb-binaries
            packages/dms/.antelope/cache
          key: dms-test-harness-${{ runner.os }}-${{ hashFiles('packages/dms/src/test/antelope.test.ts', 'packages/dms/antelope-lock/**') }}
      - run: pnpm --dir packages/dms build
      - run: node .agents/skills/${{ matrix.check }}/check.mjs
      - if: ${{ !cancelled() }}
        uses: AntelopeJS/.github/.github/actions/module-locks-committed@v2
