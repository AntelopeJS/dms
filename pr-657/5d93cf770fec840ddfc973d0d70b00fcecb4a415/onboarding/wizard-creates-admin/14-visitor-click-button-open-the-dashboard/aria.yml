- text: Terminal Shell
- button "Copy"
- code: "# Needs Node.js 22.18+, pnpm and MongoDB on localhost:27017 (or MONGO_URL) git clone https://github.com/AntelopeJS/dms.git cd dms pnpm install # Backend: builds the DMS and the playground, then serves the API cd packages/dms pnpm exec ajs project run -p playground # Frontend, in a second terminal from the repository root pnpm --dir packages/dms frontend:dev"
- text: "Add a demo: create a page class under playground/src/<area>/ and export it from that area's index.ts."
