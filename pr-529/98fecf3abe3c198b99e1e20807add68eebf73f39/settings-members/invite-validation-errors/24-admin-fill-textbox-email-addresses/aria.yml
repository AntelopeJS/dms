- dialog "Invite members":
  - heading "Invite members" [level=2]
  - paragraph: They’ll get an email with a link to join. It stays valid for 7 days.
  - button "Close"
  - alert:
    - text: 2 fields need your attention
    - list:
      - listitem:
        - link "Email addresses":
          - /url: "#emails"
      - listitem:
        - link "Team":
          - /url: "#playground__team"
  - text: Email addresses
  - paragraph: Paste a list to invite several people with the same roles.
  - textbox "Email addresses":
    - /placeholder: Add addresses, separated with a comma
    - text: admin+20261029t055349-77b0cc@verify.local
  - text: This field is required. Playground onboarding
  - paragraph: Added by the playground's RegisterInviteExtension
  - text: Team
  - combobox "Team"
  - text: This value isn’t valid. Roles
  - group "Roles":
    - button "Support 44b48b" [pressed]
  - paragraph:
    - text: "Support 44b48b: 1 of 1259 permissions."
    - link "Compare roles":
      - /url: /settings/workspace/roles
  - text: Invitation language
  - paragraph: The language of the email and of their account.
  - combobox "Invitation language": English
  - text: Name
  - paragraph: Optional. They can change it when they join.
  - textbox "Name":
    - /placeholder: Nicolas Petit
  - text: Make workspace owner Owners have every permission, including billing, roles and removing members. Roles above are ignored. A workspace can have several owners.
  - switch "Make workspace owner Owners have every permission, including billing, roles and removing members. Roles above are ignored. A workspace can have several owners."
  - paragraph: Required fields
  - button "Cancel"
  - button "Send invitations"
