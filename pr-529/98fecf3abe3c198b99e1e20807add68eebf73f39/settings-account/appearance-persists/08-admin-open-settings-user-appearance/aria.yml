- heading "Appearance" [level=1]
- paragraph: Theme and density for this browser. Other devices keep their own choice.
- text: Saved instantly
- heading "Interface theme" [level=2]
- paragraph: Adapt your color theme for your Antelope DMS
- radio "System Matches your OS setting" [checked]
- text: System Matches your OS setting
- radio "Light Bright surfaces"
- text: Light Bright surfaces
- radio "Dark Easy on the eyes"
- text: Dark Easy on the eyes
- heading "Interface density" [level=2]
- paragraph: Scale the whole interface up or down while keeping proportions. Use Small to fit more data on screen, Large for comfort on big displays
- radio "Small Compact · more data"
- text: Small Compact · more data
- radio "Normal Default" [checked]
- text: Normal Default
- radio "Large Spacious · big screens"
- text: Large Spacious · big screens
- heading "Accessibility" [level=2]
- paragraph: Calmer, crisper and easier-to-scan screens on this device. Density above scales the text.
- text: Reduce motion
- paragraph: Turns off animations and transitions, live pulses and chart animations. Automatic follows your operating system's setting.
- radiogroup "Reduce motion":
  - radio "Automatic" [checked]
  - radio "On"
  - radio "Off"
- text: Increase contrast
- paragraph: Darker secondary text and stronger borders, in light and dark themes.
- switch "Increase contrast"
- text: Always underline links
- paragraph: Underlines links in content and tables, so they don't rely on color alone. Menus and buttons stay as they are.
- switch "Always underline links"
- heading "Sidebar" [level=2]
- paragraph: You can also collapse it any time with the button next to the breadcrumb.
- text: Start with the sidebar collapsed
- paragraph: Shows icons only, with labels on hover. Handy on small laptop screens.
- switch "Start with the sidebar collapsed"
- heading "Developer" [level=2]
- paragraph: Design tokens used by the interface, for building modules that match it.
