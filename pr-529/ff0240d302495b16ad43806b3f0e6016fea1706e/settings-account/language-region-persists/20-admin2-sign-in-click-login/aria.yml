- heading "How to use it" [level=2]
- paragraph: A few habits that get the most out of the playground.
- text: 1. Look a feature up
- paragraph: The feature index lists every DMS feature, the API that turns it on and the page that shows it.
- text: 2. Browse the sidebar
- paragraph: Each entry is a live demo of one feature, with sample data you can change freely.
- text: 3. Open the source next to the page
- paragraph: "Every page is a class under packages/dms/playground/src/<area>/: /table-view/table-view-users, for example, is table-view/users/page.ts."
- text: 4. Jump anywhere with the command palette
- paragraph: "Ctrl K (⌘K on macOS) opens the command palette: search pages, actions, settings and the features of the feature index."
- text: 5. Switch theme and language
- paragraph: Open the user menu at the bottom of the sidebar to change the theme or the dashboard language.
- text: 6. See the dashboard as a role
- paragraph: In Settings › Roles, Preview as role shows the pages and actions that role is allowed to see, without signing out.
- text: 7. Sign in with your own account
- paragraph: "Use your own account: its roles decide which pages and actions you see."
- heading "How it's built" [level=2]
- paragraph: "No page here was drawn by hand: the backend describes it, the DMS frontend renders it."
- paragraph: A page is a class
- paragraph: The whole Users demo, declared in TypeScript.
- link "Open the page":
  - /url: /table-view/table-view-users
- paragraph: From class to screen
- text: 1. The backend registers the class
- paragraph: "@RegisterPage() files it under its category in the sidebar; its id is also its permission id."
- text: 2. The DMS serves its layout
- paragraph: Each static field becomes a block of the page layout, sent as JSON and filtered by the user's permissions.
- text: 3. The frontend draws it
- paragraph: Each block maps to a Vue component of a frontend layer. CustomComponent mounts your own, like the hero above.
