packages:
  - packages/*
  - packages/dms/frontend-vue
  # Installed like a project consuming the DMS, but from inside the workspace so
  # it resolves the two packages by link rather than through a committed
  # `file:` override.
  - packages/dms/playground

onlyBuiltDependencies:
  - "@antelopejs/core"
  - sharp
  - "@parcel/watcher"
  - esbuild
  - puppeteer
  - vue-demi
allowBuilds:
  lefthook: false
overrides:
  "@antelopejs/interface-data-api": "file:.tgz-deps/antelopejs-interface-data-api-170f079.tgz"
