packages:
  - packages/*
  - packages/dms/frontend-vue
  # Installed like a project consuming the DMS, but from inside the workspace so
  # it resolves the two packages by link rather than through a committed
  # `file:` override.
  - packages/dms/playground

onlyBuiltDependencies:
  - "@antelopejs/core"
  - sharp
  - "@parcel/watcher"
  - esbuild
  - puppeteer
  - vue-demi
overrides:
  "@antelopejs/interface-api": "0.2.0"
  "@antelopejs/interface-api-util": "0.3.0"
  "@antelopejs/interface-dms-automation": "file:.campaign/tgz/antelopejs-interface-dms-automation-b4bc5d2.tgz"
  "@antelopejs/api": "file:.campaign/tgz/antelopejs-api-6afe3e2.tgz"
