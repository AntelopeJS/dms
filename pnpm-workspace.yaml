packages:
  - packages/*
  - packages/dms/frontend-vue
  # Installed like a project consuming the DMS, but from inside the workspace so
  # it resolves the two packages by link rather than through a committed
  # `file:` override.
  - packages/dms/playground

onlyBuiltDependencies:
  - "@antelopejs/core"
  - sharp
  - "@parcel/watcher"
  - esbuild
  - puppeteer
  - vue-demi
overrides:
  "@antelopejs/interface-database": "file:.campaign/tgz/antelopejs-interface-database-6bef278.tgz"
  "@antelopejs/interface-database-decorators": "file:.campaign/tgz/antelopejs-interface-database-decorators-fcb0a29.tgz"
  "@antelopejs/interface-data-api": "file:.campaign/tgz/antelopejs-interface-data-api-2b29c9d.tgz"
