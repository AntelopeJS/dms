packages:
  - packages/*
  - packages/dms/frontend-vue
  # Installed like a project consuming the DMS, but from inside the workspace so
  # it resolves the two packages by link rather than through a committed
  # `file:` override.
  - packages/dms/playground

onlyBuiltDependencies:
  - "@antelopejs/core"
  - sharp
  - "@parcel/watcher"
  - esbuild
  - puppeteer
  - vue-demi
overrides:
  "@antelopejs/interface-database": "file:.campaign/tgz/antelopejs-interface-database-4939b45.tgz"
  "@antelopejs/interface-database-decorators": "file:.campaign/tgz/antelopejs-interface-database-decorators-d4f3b5a.tgz"
